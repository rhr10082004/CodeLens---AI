services:
  - type: web
    name: codelens-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codelens-ai-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: codelens-ai-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://codelens-ai-eight-ivory.vercel.app
      - key: MAX_SOURCE_BYTES
        value: "200000"
      - key: STORE_SOURCE_BY_DEFAULT
        value: "false"
  - type: keyvalue
    name: codelens-ai-redis
    plan: free
    region: oregon
    ipAllowList: []
databases:
  - name: codelens-ai-postgres
    databaseName: codelens
    user: codelens
    plan: free
    region: oregon
